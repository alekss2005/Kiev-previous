<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
<title>KYIV OSINT RADAR — Preview UI 1·2·3·5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#050a10; --panel:rgba(8,16,24,.92); --text:#e8f0f5; --muted:#7a8f9e;
  --accent:#22d3ee; --border:rgba(34,211,238,.18); --danger:#ef4444; --ok:#34d399;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.header{
  min-height:44px;background:rgba(5,10,16,.94);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:8px 12px;z-index:1000;
  backdrop-filter:blur(12px);font-size:12px;
}
.logo{font-weight:800;letter-spacing:.06em;font-size:11px;font-family:ui-monospace,monospace;display:flex;gap:8px;align-items:center}
.logo span.ic{filter:drop-shadow(0 0 6px var(--accent))}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:700;font-family:ui-monospace,monospace}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.badge-preview{
  font-size:9px;font-weight:800;padding:3px 8px;border-radius:999px;
  background:rgba(34,211,238,.15);border:1px solid var(--border);color:var(--accent);
  font-family:ui-monospace,monospace;
}
#map{flex:1;min-height:0;background:#0b1520}
.hud-bottom{position:absolute;bottom:14px;left:0;right:0;z-index:1000;padding:0 8px;pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.btn-row{
  display:flex;gap:6px;justify-content:center;padding:6px 10px;
  background:var(--panel);border:1px solid var(--border);border-radius:999px;
  backdrop-filter:blur(16px);box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:340px;margin:0 auto;
}
.btn-row button{
  background:transparent;border:0;color:var(--text);width:40px;height:40px;border-radius:999px;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.btn-row button:active{background:rgba(34,211,238,.15)}
.btn-row button.more{color:var(--accent);font-weight:800}
.menu{
  display:none;position:absolute;bottom:64px;left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;
  min-width:200px;z-index:1100;backdrop-filter:blur(16px);
}
.menu.show{display:block}
.menu button{
  display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);
  padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;
}
.menu button:hover{background:rgba(34,211,238,.12)}
/* markers */
.mk-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.mk-uav svg, .mk-ballistic svg{display:block}
.mk-uav{filter:drop-shadow(0 0 3px rgba(234,179,8,.8))}
.mk-ballistic{filter:drop-shadow(0 0 5px rgba(239,68,68,.95))}
.mk-label{
  margin-top:2px;font-size:10px;font-weight:700;color:#67e8f9;
  text-shadow:0 0 4px #000,0 1px 2px #000;white-space:nowrap;
  background:rgba(5,10,16,.65);padding:1px 5px;border-radius:4px;
  border:1px solid rgba(34,211,238,.25);
}
.legend-float{
  position:absolute;top:56px;left:8px;z-index:900;
  background:rgba(8,16,24,.9);border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;font-size:11px;line-height:1.6;backdrop-filter:blur(10px);
  max-width:180px;
}
.legend-float b{color:var(--accent);font-size:10px;letter-spacing:.04em}
.legend-float .row{display:flex;align-items:center;gap:8px;margin-top:4px}
.sw-uav{width:10px;height:10px;border-radius:50%;background:#eab308;border:1px solid #fff}
.sw-bal{width:12px;height:12px;background:#ef4444;clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)}
.coords-bar{
  position:absolute;top:56px;right:8px;z-index:900;
  background:rgba(8,16,24,.9);border:1px solid var(--border);border-radius:10px;
  padding:6px 10px;font-size:10px;font-family:ui-monospace,monospace;color:var(--muted);
  backdrop-filter:blur(10px);
}
.coords-bar span{color:var(--text)}
.leaflet-control-scale{
  background:rgba(7,16,24,.85)!important;border:1px solid rgba(34,211,238,.25)!important;
  border-radius:6px!important;padding:2px 6px!important;color:#e2e8f0!important;margin:8px!important;
}
.leaflet-control-scale-line{
  border-color:#94a3b8!important;color:#e2e8f0!important;background:transparent!important;
  font-size:10px!important;font-weight:700!important;
}
.leaflet-control-zoom a{
  background:rgba(12,22,32,.9)!important;color:#e8f0f5!important;
  border:1px solid rgba(148,163,184,.22)!important;width:34px!important;height:34px!important;
}
.note{
  position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:900;
  font-size:10px;color:var(--muted);background:rgba(8,16,24,.85);padding:4px 10px;
  border-radius:999px;border:1px solid var(--border);white-space:nowrap;
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo"><span class="ic">🛰</span> KYIV OSINT RADAR</div>
    <div class="badge-preview">PREVIEW · UI 1·2·3·5</div>
    <div class="status"><span class="dot"></span> ONLINE</div>
  </div>
  <div id="map"></div>
  <div class="legend-float">
    <b>ПРЕВЬЮ МАРКЕРІВ</b>
    <div class="row"><span class="sw-uav"></span> БПЛА ▲ стрілка по курсу</div>
    <div class="row"><span class="sw-bal"></span> Балістика 🚀 силует</div>
    <div class="row" style="color:var(--muted);font-size:10px">Тонкий пунктир = траса</div>
  </div>
  <div class="coords-bar">zoom <span id="zoomV">—</span><br>center <span id="centerV">—</span></div>
  <div class="note">Реальні координати Києва · масштабуйте карту</div>
  <div class="menu" id="moreMenu">
    <button type="button">🎯 Кільця</button>
    <button type="button">🏘 Населені пункти</button>
    <button type="button">🏗 Інфраструктура</button>
    <button type="button">⚡ Підстанції</button>
    <button type="button">✈️ Стратегічна</button>
    <button type="button">📡 Масовані пуски</button>
    <button type="button">📍 Мітки</button>
    <button type="button">🛰 Схема/Супутник</button>
  </div>
  <div class="hud-bottom">
    <div class="btn-row">
      <button type="button" title="Оновити">↻</button>
      <button type="button" title="Статус">📊</button>
      <button type="button" title="Гео">🧭</button>
      <button type="button" title="Звук">🔔</button>
      <button type="button" title="Сирена">🚨</button>
      <button type="button" class="more" id="btnMore" title="Ще">⋯</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KYIV = [50.4501, 30.5234];

// Real places in Kyiv / oblast (WGS84)
const UAVS = [
  { name: "Оболонь", lat: 50.501, lon: 30.498 },
  { name: "Позняки", lat: 50.412, lon: 30.633 },
  { name: "Троєщина", lat: 50.513, lon: 30.608 },
  { name: "Нивки", lat: 50.476, lon: 30.411 },
  { name: "Бровари", lat: 50.507, lon: 30.801 },
  { name: "Ірпінь", lat: 50.521, lon: 30.250 },
];

const BALLISTIC = [
  { name: "Печерськ", lat: 50.427, lon: 30.538 },
  { name: "Дарниця", lat: 50.445, lon: 30.630 },
];

// Trail: simulated approach toward Kyiv through real points (Nizhyn-ish → Brovary → Troieshchyna)
const TRAIL = [
  [50.72, 31.20],   // near Nizhyn direction
  [50.62, 30.95],
  [50.55, 30.78],
  [50.513, 30.608], // Troieshchyna
];

const map = L.map("map", { center: KYIV, zoom: 11, zoomControl: false });
L.control.zoom({ position: "bottomright" }).addTo(map);
L.control.scale({ position: "bottomleft", metric: true, imperial: false, maxWidth: 120 }).addTo(map);

// Same tile style family as main app (Esri imagery + labels)
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles © Esri"
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, opacity: 0.85
}).addTo(map);

// Soft rings like app
L.circle(KYIV, { radius: 12000, color: "#3b82f6", weight: 1, opacity: 0.45, fill: false, dashArray: "6 6" }).addTo(map);
L.circle(KYIV, { radius: 25000, color: "#22d3ee", weight: 1, opacity: 0.25, fill: false, dashArray: "4 8" }).addTo(map);

// (5) Thin trail — no heavy glow
L.polyline(TRAIL, {
  color: "#dc2626", weight: 2, opacity: 0.85, dashArray: "6 8", lineCap: "round"
}).addTo(map);

function uavIcon(label, heading) {
  const rot = heading != null ? heading : 0;
  const arrow = `<div class="mk-uav" style="transform:rotate(${rot}deg)"><svg width="18" height="18" viewBox="0 0 16 16"><path fill="#eab308" stroke="#fff" stroke-width="1.1" stroke-linejoin="round" d="M8 1.5 L14.5 13.5 L8 11 L1.5 13.5 Z"/></svg></div>`;
  return L.divIcon({
    className: "",
    html: `<div class="mk-wrap">${arrow}<div class="mk-label">${label}</div></div>`,
    iconSize: [72, 36], iconAnchor: [36, 9]
  });
}
function ballisticIcon() {
  const mis = `<div class="mk-ballistic"><svg width="24" height="24" viewBox="0 0 28 28"><path fill="#ef4444" stroke="#fff" stroke-width="1.2" d="M14 2 L18 10 L17 18 L20 24 L14 22 L8 24 L11 18 L10 10 Z"/><rect x="12.2" y="10" width="3.6" height="8" rx="0.8" fill="#1a1a1a" opacity=".35"/></svg></div>`;
  return L.divIcon({
    className: "",
    html: `<div class="mk-wrap">${mis}</div>`,
    iconSize: [24, 24], iconAnchor: [12, 12]
  });
}

function bearing(a, b) {
  const toRad = Math.PI / 180, toDeg = 180 / Math.PI;
  const φ1 = a[0]*toRad, φ2 = b[0]*toRad, Δλ = (b[1]-a[1])*toRad;
  const y = Math.sin(Δλ)*Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (Math.atan2(y, x)*toDeg + 360) % 360;
}
UAVS.forEach(p => {
  const hdg = bearing([p.lat, p.lon], KYIV);
  L.marker([p.lat, p.lon], { icon: uavIcon(p.name, hdg), zIndexOffset: 500 })
    .addTo(map)
    .bindPopup(`<b>БПЛА</b><br>${p.name}<br>курс ≈ ${hdg.toFixed(0)}° → Київ<br><code>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</code>`);
});

BALLISTIC.forEach(p => {
  L.marker([p.lat, p.lon], { icon: ballisticIcon(), zIndexOffset: 800 })
    .addTo(map)
    .bindPopup(`<b style="color:#ef4444">БАЛІСТИКА</b><br>${p.name}<br><code>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</code>`);
});

// Center marker (Kyiv)
L.circleMarker(KYIV, { radius: 4, color: "#22d3ee", fillColor: "#22d3ee", fillOpacity: 1, weight: 2 })
  .addTo(map).bindPopup("Київ · центр моделі<br><code>50.4501, 30.5234</code>");

function upd() {
  const c = map.getCenter();
  document.getElementById("zoomV").textContent = map.getZoom().toFixed(1);
  document.getElementById("centerV").textContent = c.lat.toFixed(4) + ", " + c.lng.toFixed(4);
}
map.on("move zoom", upd);
upd();

document.getElementById("btnMore").onclick = () => {
  document.getElementById("moreMenu").classList.toggle("show");
};
map.on("click", () => document.getElementById("moreMenu").classList.remove("show"));
</script>
</body>
</html>
